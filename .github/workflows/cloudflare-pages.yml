name: Alethe CI and Cloudflare Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ops/cloudflare-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: alethe-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Install Wrangler
        run: npm install --no-save --ignore-scripts wrangler@4
      - name: Provision Alethe only, migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: |
          python3 scripts/cloudflare-bootstrap.py
          npx --no-install wrangler d1 migrations apply alethe-db --remote
          npx --no-install wrangler pages deploy dist --project-name alethe --branch main
      - name: Verify home and database health
        run: |
          url="$(cat "$RUNNER_TEMP/alethe-url")"
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$url/" -o /tmp/alethe-home.html
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$url/api/health" | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ok"'
          printf 'Verified deployment: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
